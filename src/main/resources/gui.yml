# ============================================================================
#                           GUI СПИСКА РУН И ПРЕДМЕТОВ
# ============================================================================
# Меню открывается командой /pnrelic list. ЛКМ по предмету выдаёт его игроку.
# После изменения файла выполните /pnrelic reload.
#
# list.title — заголовок инвентаря; поддерживаются &-цвета и RGB &#RRGGBB.
# list.size — размер GUI: 9, 18, 27, 36, 45 или 54.
# list.content-slots — слоты предметов, нумерация начинается с 0.
# Список можно задавать компактно: [10, 11, 12]. Повторы и слоты за пределами
# размера игнорируются.
#
# decor — заполнитель пустых ячеек. Поддерживает material и name.
# entry-lore — строки, добавляемые в конец описания каждого предмета списка.
#
# КНОПКИ
# page-info, previous-page, next-page, previous-page-disabled,
# next-page-disabled и close имеют одинаковый формат:
# slot — слот кнопки; base64 — текстура; name — название;
# lore — описание, [] означает полностью пустое описание.
# YAML-якорь &disabled-page позволяет не повторять одинаковые настройки,
# а <<: *disabled-page копирует значения в следующую кнопку.
#
# ДОСТУПНЫЕ ПЛЕЙСХОЛДЕРЫ GUI
# {page} — текущая страница; {pages} — общее количество страниц;
# {previous} — номер предыдущей; {next} — номер следующей;
# {amount} — общее количество настроенных рун и предметов.
# ============================================================================
