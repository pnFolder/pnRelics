# ============================================================================
#                              СООБЩЕНИЯ PNRELICS
# ============================================================================
# Поддерживаются стандартные цвета &a, форматирование &l и RGB &#RRGGBB.
# {prefix} подставляет значение prefix в любое сообщение.
# После изменения файла выполните /pnrelic reload.
#
# ПЛЕЙСХОЛДЕРЫ
# {player} — имя игрока; {name} — отображаемое имя руны или предмета;
# {amount} — количество; {count} — число загруженных рун и предметов;
# {error} — причина ошибки перезагрузки.
# Плейсхолдеры используются только в тех сообщениях, где они уже указаны.
#
# help — список строк, показываемый при вводе /pnrelic без аргументов.
# Пустую строку можно задать как "".
# ============================================================================
prefix: "&x&8&B&5&C&F&6&lᴘɴʀᴇʟɪᴄѕ &8• &f"
no-permission: "{prefix}&x&D&A&9&3&F&8нᴇдостᴀточно пᴘᴀв."
player-only: "{prefix}&x&D&A&9&3&F&8эту ᴋомᴀнду можᴇт испольɜовᴀть тольᴋо игᴘоᴋ."
player-not-found: "{prefix}&x&D&A&9&3&F&8игᴘоᴋ &f{player} &x&D&A&9&3&F&8нᴇ нᴀйдᴇн."
relic-not-found: "{prefix}&x&D&A&9&3&F&8ᴘунᴀ или пᴘᴇдмᴇт с нᴀɜвᴀниᴇм &f{name} &x&D&A&9&3&F&8нᴇ нᴀйдᴇны."
invalid-amount: "{prefix}&x&D&A&9&3&F&8ᴋоличᴇство должно ҕыть цᴇлым числом от 1 до 2304."
give-success: "{prefix}&x&D&A&9&3&F&8игᴘоᴋу &#A78BFA{player} &x&D&A&9&3&F&8выдᴀно &#A78BFA{amount} шт. &r{name}&f."
receive-success: "{prefix}&x&D&A&9&3&F&8вы получили &#A78BFA{amount} шт. &r{name}&f."
inventory-full: "{prefix}&x&D&8&F&F&2&1чᴀсть пᴘᴇдмᴇтов нᴇ помᴇстилᴀсь и выпᴀлᴀ ᴘядом с игᴘоᴋом."
reload-success: "{prefix}&x&2&1&F&F&3&0ᴋонфигуᴘᴀция, ᴘуны, пᴘᴇдмᴇты и ɢᴜɪ пᴇᴘᴇɜᴀгᴘужᴇны. ɜᴀгᴘужᴇно: &f{count}&a."
reload-failed: "{prefix}&x&D&A&9&3&F&8пᴇᴘᴇɜᴀгᴘуɜᴋᴀ отмᴇнᴇнᴀ: &f{error}"
list-empty: "{prefix}&x&D&A&9&3&F&8в ᴋонфигуᴘᴀции поᴋᴀ нᴇт ᴘун или пᴘᴇдмᴇтов."
list-taken: "{prefix}&x&D&A&9&3&F&8получᴇно: &r{name}&f."
help:
  - "&8&m                                                   "
